<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #2012d8;
            color: #aaaaaa;
        }

        header {
            background-color: #3020be;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #444444;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .container {
            width: 60%;
            margin: 30px auto;
        }

        .contact-form {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #241fb5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Contact</h1>
        <p>Hubungi saya melalui form berikut</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">

        <div class="contact-form">
            <h2>Contact Me</h2>

            <form>
                <label for="name">Nama</label>
                <input type="text" id="name" name="name" placeholder="Masukkan nama" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email" required>

                <label for="phone">Nomor HP</label>
                <input type="tel" id="phone" name="phone" placeholder="Masukkan nomor HP">

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tulis pesan kamu..." required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Universitas Pelita Bangsa</p>
    </footer>

</body>
</html>
